[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "HMI"
version = "2.0.0"
description = "Human Machine Interface for Trading Analytics"
readme = "README.md"
license = { text = "Open Source (Educational Use)" }
authors = [
    { name = "Ottmar Uriza", email = "ottmar@example.com" }
]
keywords = ["trading", "dash", "plotly", "machine-learning", "visualization", "analytics"]
requires-python = ">=3.9"

# Dependencias validadas (versión estable comprobada en tu entorno)
dependencies = [
    "dash==2.14.2",
    "plotly==5.17.0",
    "pandas>=2.0,<2.3",
    "numpy>=1.24,<2.0",
    "flask>=2.3,<3.0",
    "requests>=2.31",
    "scikit-learn>=1.3,<2.0",
    "scipy>=1.10,<2.0",
    "joblib>=1.3",
    "gunicorn>=21.2"
]

[project.urls]
Homepage = "https://github.com/ottmaruriza/HMI"
Documentation = "https://github.com/ottmaruriza/HMI/wiki"

[tool.setuptools.packages.find]
where = ["src"]
include = ["HMI*"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.hatch.build.targets.wheel]
packages = ["HMI"]

[tool.hmi]
description = "Human Machine Interface for market analytics, technical indicators, AI predictions and order book visualization"
author = "Ottmar Uriza"

