[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MLFramework"
dynamic = ["version"]
description = "Framework de Machine Learning para integración de múltiples modelos (Random Forest, ANN, Deep Learning, etc.)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Ottmar Uriza" }
]
license = { text = "MIT" }

dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.3",
    "xgboost>=2.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "MLFramework.__version__"}

